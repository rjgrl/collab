packages:
  - apps/*
  - packages/*
# pnpm 10+ reads overrides from this file, not package.json. vite-plus
# requires the real `vite` package to resolve to its own core build.
overrides:
  vite: "npm:@voidzero-dev/vite-plus-core@0.3.1"
allowBuilds:
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
catalog:
  zod: ^4.5.4
  typescript: ^6.0.3
  "@types/node": ^26.4.1
  varlock: 1.18.0
  "@orpc/server": ^1.15.0
  "@orpc/openapi": ^1.15.0
  "@orpc/zod": ^1.15.0
  lucide-react: ^1.41.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.8
  "@orpc/client": ^1.15.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  tailwindcss: ^4.3.3
