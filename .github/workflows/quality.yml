name: Local-equivalent quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: mongodb://127.0.0.1:27018/collab_ci?replicaSet=rs0
      CORS_ORIGIN: http://localhost:3001
      APP_URL: http://localhost:3000
      VITE_SERVER_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 12.5.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git diff --check
      - run: pnpm --filter web build
      - run: pnpm check-types
      - run: pnpm test:browser-types
      - run: pnpm exec vp lint --deny-warnings
      - run: pnpm test
      - run: pnpm check:secrets
      - run: pnpm audit --audit-level=moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:completion-db
      - run: pnpm test:browser
      - run: pnpm build
      - run: pnpm check:production-build
      - run: pnpm check:server-build
